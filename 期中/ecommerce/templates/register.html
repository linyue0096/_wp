{% extends "base.html" %}
{% block title %}註冊 - E-Shop{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4 py-8">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-store text-4xl gradient-bg text-transparent bg-clip-text"></i>
            <h2 class="text-2xl font-bold mt-2">建立帳號</h2>
        </div>
        {% if error %}
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用戶名稱</label>
                <input type="text" name="username" required class="input-field" placeholder="請輸入用戶名稱">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">電子郵件</label>
                <input type="email" name="email" required class="input-field" placeholder="請輸入電子郵件">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                <input type="password" name="password" required class="input-field" placeholder="請輸入密碼">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">確認密碼</label>
                <input type="password" name="confirm_password" required class="input-field" placeholder="請再次輸入密碼">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">角色</label>
                <select name="role" class="input-field">
                    <option value="buyer">買家</option>
                    <option value="seller">賣家</option>
                </select>
            </div>
            <button type="submit" class="w-full btn-primary py-3">註冊</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            已有帳號？ <a href="/auth/login" class="text-indigo-600 hover:underline">立即登入</a>
        </p>
    </div>
</div>
{% endblock %}
