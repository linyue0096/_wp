{% extends "base.html" %}
{% block title %}{% if product %}編輯商品{% else %}新增商品{% endif %} - E-Shop{% endblock %}
{% block content %}
<div class="max-w-3xl mx-auto px-4 py-8">
    <a href="/seller/products" class="text-indigo-600 hover:underline mb-4 inline-block">
        <i class="fas fa-arrow-left mr-2"></i>返回商品列表
    </a>
    <div class="bg-white rounded-xl p-8 shadow-sm border border-gray-100">
        <h1 class="text-2xl font-bold mb-6">
            {% if product %}<i class="fas fa-edit mr-2"></i>編輯商品{% else %}<i class="fas fa-plus mr-2"></i>新增商品{% endif %}
        </h1>
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">商品名稱</label>
                <input type="text" name="name" required class="input-field" value="{{ product.name }}" placeholder="請輸入商品名稱">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">分類</label>
                <select name="category_id" required class="input-field">
                    {% for cat in categories %}
                    <option value="{{ cat.id }}" {% if product and product.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">描述</label>
                <textarea name="description" required rows="5" class="input-field" placeholder="請輸入商品描述">{{ product.description }}</textarea>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">價格 (NT$)</label>
                    <input type="number" name="price" required step="0.01" min="0" class="input-field" value="{{ product.price }}" placeholder="0.00">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">庫存數量</label>
                    <input type="number" name="stock" required min="0" class="input-field" value="{{ product.stock }}" placeholder="0">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">圖片網址</label>
                <input type="text" name="image_url" class="input-field" value="{{ product.image_url }}" placeholder="https://example.com/image.jpg">
            </div>
            <div class="flex space-x-4 pt-4">
                <button type="submit" class="btn-primary">
                    {% if product %}<i class="fas fa-save mr-2"></i>更新商品{% else %}<i class="fas fa-plus mr-2"></i>建立商品{% endif %}
                </button>
                <a href="/seller/products" class="btn-secondary">取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
