{% extends "base.html" %}
{% block title %}結帳 - E-Shop{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6"><i class="fas fa-credit-card mr-2"></i>結帳</h1>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
        <div>
            <div class="bg-white rounded-xl p-6 shadow-sm border border-gray-100 mb-6">
                <h2 class="text-lg font-bold mb-4">商品明細</h2>
                {% for item in items %}
                <div class="flex items-center gap-3 py-2 border-b border-gray-100 last:border-0">
                    <img src="{{ item.image_url }}" alt="{{ item.product_name }}" class="w-12 h-12 object-cover rounded">
                    <div class="flex-1">
                        <p class="font-medium text-sm">{{ item.product_name }} x{{ item.quantity }}</p>
                        <p class="text-red-500 text-sm font-bold">NT$ {{ item.price * item.quantity }}</p>
                    </div>
                </div>
                {% endfor %}
                <div class="flex justify-between text-lg font-bold mt-4 pt-4 border-t">
                    <span>總計</span>
                    <span class="text-red-500">NT$ {{ total }}</span>
                </div>
            </div>
        </div>

        <div>
            <form method="POST" class="bg-white rounded-xl p-6 shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4">收貨資訊</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-1">收貨地址</label>
                    <textarea name="shipping_address" required rows="3"
                              class="input-field" placeholder="請填寫完整收貨地址"></textarea>
                </div>

                <h2 class="text-lg font-bold mb-4 mt-6">付款方式</h2>
                <div class="space-y-3">
                    <label class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:border-indigo-300 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                        <input type="radio" name="payment_method" value="cod" class="mr-3" checked>
                        <div>
                            <div class="font-medium text-gray-800">
                                <i class="fas fa-money-bill-wave text-green-500 mr-2"></i>貨到付款 (COD)
                            </div>
                            <p class="text-sm text-gray-500">收到商品時以現金付款</p>
                        </div>
                    </label>
                    <label class="flex items-center p-4 border border-gray-200 rounded-lg cursor-pointer hover:border-indigo-300 has-[:checked]:border-indigo-500 has-[:checked]:bg-indigo-50">
                        <input type="radio" name="payment_method" value="credit_card" class="mr-3">
                        <div>
                            <div class="font-medium text-gray-800">
                                <i class="fas fa-credit-card text-blue-500 mr-2"></i>信用卡付款
                            </div>
                            <p class="text-sm text-gray-500">支援 VISA / Mastercard / JCB</p>
                        </div>
                    </label>
                </div>

                <button type="submit" class="w-full btn-primary py-3 mt-6 text-lg">
                    <i class="fas fa-check-circle mr-2"></i>確認下單
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
