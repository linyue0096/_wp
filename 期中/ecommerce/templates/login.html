{% extends "base.html" %}
{% block title %}登入 - E-Shop{% endblock %}
{% block content %}
<div class="min-h-[60vh] flex items-center justify-center px-4">
    <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
        <div class="text-center mb-6">
            <i class="fas fa-store text-4xl gradient-bg text-transparent bg-clip-text"></i>
            <h2 class="text-2xl font-bold mt-2">登入帳號</h2>
        </div>
        {% if error %}
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg mb-4 text-sm">
            <i class="fas fa-exclamation-circle mr-2"></i>{{ error }}
        </div>
        {% endif %}
        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">用戶名稱</label>
                <input type="text" name="username" required class="input-field" placeholder="請輸入用戶名稱">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">密碼</label>
                <input type="password" name="password" required class="input-field" placeholder="請輸入密碼">
            </div>
            <button type="submit" class="w-full btn-primary py-3">登入</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            還沒有帳號？ <a href="/auth/register" class="text-indigo-600 hover:underline">立即註冊</a>
        </p>
        <div class="mt-6 p-4 bg-gray-50 rounded-lg text-sm text-gray-600">
            <p class="font-semibold mb-2">Demo 帳號：</p>
            <p>買家：demobuyer / buyer123</p>
            <p>賣家：demoseller / seller123</p>
        </div>
    </div>
</div>
{% endblock %}
